<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — minzdrav.ru</title>
    <link rel="icon" href="/img/logo.png">
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-logo">
                <img src="/img/logo.png" alt="minzdrav.ru">
            </div>
            <p class="auth-subtitle">Вход в почтовый ящик</p>

            <div class="error-message" id="errorMsg"></div>
            <div class="success-message" id="successMsg"></div>

            <form id="loginForm" autocomplete="on">
                <div class="form-group">
                    <label for="email">Введите свою почту</label>
                    <div class="email-input-wrapper">
                        <input type="text" id="email" name="username" autocomplete="username" placeholder="название" required maxlength="32">
                        <span class="email-suffix">@minzdrav.ru</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Введите пароль</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Ваш пароль" required maxlength="32">
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="remember" checked>
                    <label for="remember">Запомнить меня</label>
                </div>

                <button type="submit" class="btn btn-full">Войти</button>
            </form>

            <div class="auth-links">
                <a href="/recovery">Забыли пароль?</a>
                <span class="divider">•</span>
                <a href="/register">Регистрация</a>
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
</body>
</html>
