<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — minzdrav.ru</title>
    <link rel="icon" href="/img/logo.svg">
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-logo">
                <img src="/img/logo.svg" alt="minzdrav.ru">
                <h1>minzdrav.ru</h1>
            </div>
            <p class="auth-subtitle">Создание нового ящика</p>

            <div class="error-message" id="errorMsg"></div>
            <div class="success-message" id="successMsg"></div>

            <form id="registerForm" autocomplete="on">
                <div class="form-group">
                    <label for="email">Введите название вашей почты</label>
                    <div class="email-input-wrapper">
                        <input 
                            type="text" 
                            id="email" 
                            name="username"
                            autocomplete="username"
                            placeholder="название"
                            required
                            maxlength="32"
                            pattern="[a-z0-9]+"
                        >
                        <span class="email-suffix">@minzdrav.ru</span>
                    </div>
                    <p class="hint">Только английские буквы (маленькие) и цифры. Без пробелов и символов. До 32 знаков.</p>
                </div>

                <div class="form-group">
                    <label for="password">Введите пароль</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="new-password"
                        autocomplete="new-password"
                        placeholder="Придумайте пароль"
                        required
                        maxlength="32"
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Подтвердите пароль повторным вводом</label>
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        name="confirm-password"
                        autocomplete="new-password"
                        placeholder="Повторите пароль"
                        required
                        maxlength="32"
                    >
                </div>

                <div class="form-group">
                    <label for="secretWord">Придумайте секретное слово</label>
                    <input 
                        type="text" 
                        id="secretWord" 
                        placeholder="Секретное слово"
                        required
                        maxlength="32"
                    >
                    <p class="hint">Поможет восстановить доступ к аккаунту. Запомните его!</p>
                </div>

                <button type="submit" class="btn btn-full">Зарегистрироваться</button>
            </form>

            <div class="auth-links">
                Уже есть аккаунт? <a href="/login">Войти</a>
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
</body>
</html>
